name: Family web build
on:
  push:
    branches: [family/ui-language]
    paths:
      - kitchenowl/**
      - .github/workflows/family-web.yml
      - deploy/family/version-web.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get
        working-directory: kitchenowl
      - name: Analyze changed settings
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/cubits/settings_cubit.dart lib/widgets/settings/app_language_tile.dart lib/pages/settings_page.dart lib/app.dart test/cubits/settings_language_test.dart
        working-directory: kitchenowl
      - name: Test interface language
        run: flutter test test/cubits/settings_language_test.dart
        working-directory: kitchenowl
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn
        working-directory: kitchenowl
      - name: Record source revision
        run: printf '%s\n' "$GITHUB_SHA" > kitchenowl/build/web/family-revision.txt
      - name: Version frontend scripts
        run: python3 deploy/family/version-web.py kitchenowl/build/web "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: kitchenowl-family-web
          path: kitchenowl/build/web
          retention-days: 30
